body.playing nav#tabs{display:none}
#backBtn{display:none;font-size:1.5rem;line-height:1} body.playing #backBtn{display:grid}
body.playing main{padding-bottom:16px}
h2{font-size:1.2rem;margin:18px 0 8px}
h3{font-size:1.02rem;margin:14px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:.86em}
.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}

.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}

.hero .btn{background:#fff;color:#0b6f78;border:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}

.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88em}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.tag{display:inline-block;font-size:.76em;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-right:4px;white-space:nowrap}

.scen{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;margin:8px 0;box-shadow:var(--shadow)}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}

.list-btn{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 4px}

.persona{display:flex;gap:12px;align-items:flex-start}
.mood{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.85em}

.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0}

.msg.sys{align-self:center;background:none;color:var(--muted);font-size:.85em;padding:2px}
.say{border:0;background:none;padding:0 0 0 6px;font-size:.95em;opacity:.7}

.dimrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.92em}

.dimrow .v{width:38px;text-align:right;font-weight:700}
.ring{width:132px;height:132px;margin:0 auto;display:block}
.center{text-align:center}

.bad-t{color:var(--bad)} .ok-t{color:var(--ok)}

.badge.on{color:var(--text)} .badge.on b{filter:none;opacity:1;background:var(--mid-soft)}
.banner{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;margin:8px 0;background:var(--brand-soft)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.4)}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;animation:up .25s ease}
#sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 6px}

#sheet .shead h2{margin:0;flex:1;font-size:1.1rem}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14282b;color:#fff;border-radius:12px;padding:10px 14px;z-index:60;display:none;align-items:center;gap:12px;max-width:calc(100% - 32px);box-shadow:0 4px 20px rgba(0,0,0,.25)}

#toast button{background:none;border:0;color:#7fe0e6;font-weight:700}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin:6px 0}
.qopt.right{border-color:var(--ok);background:var(--ok-soft)} .qopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.demo .composer{position:static}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- 語音：朗讀顧客台詞、用說的回答 ---------- */
const canSpeak = 'speechSynthesis' in window;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function speak(text) {
  if (!canSpeak) return;
  const clean = String(text).replace(/（[^）]*）|\([^)]*\)/g, '').replace(/[〇]/g, '').trim();
  if (!clean) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean); u.lang = 'zh-TW'; u.rate = 1;
  const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)); if (v) u.voice = v;
  speechSynthesis.speak(u);
}
let rec = null;
function listen(target, btn) {
  if (!SR) return toast('這個瀏覽器不支援語音輸入，可以用鍵盤的麥克風輸入');
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = 'zh-TW'; rec.interimResults = true; rec.continuous = false;
  const base = target.value;
  rec.onresult = e => { target.value = base + [...e.results].map(r => r[0].transcript).join(''); };
  rec.onend = () => { rec = null; btn.textContent = '🎤'; btn.setAttribute('aria-pressed', 'false'); };
  rec.onerror = () => toast('沒有聽清楚，請再試一次');
  btn.textContent = '⏹'; btn.setAttribute('aria-pressed', 'true'); rec.start();
}

/* =====================================================================
   教練評分引擎：把自由回答換算成五個面向的分數
   ===================================================================== */
const RX = {
  E: /了解|理解|明白|我懂|懂您|懂你|辛苦|謝謝|感謝|抱歉|不好意思|擔心|很正常|沒關係|放心|心疼|難怪|不舒服|困擾|貼心|很好的問題|好問題|尊重|您慢慢|你慢慢/g,
  A: /[？?]|請問|想了解|想問|方便|平常|是不是|哪[一些個種裡]|什麼|怎麼樣|多久|多少|有沒有|會不會|比較在意|對嗎/g,
  V: /幫您|幫你|讓您|讓你|省|划算|一天|換算|平均|可以用|好處|適合您|適合你|安心|感受|服貼|方便|不用再|一瓶多用|贈品/g,
  C: /試試|試用|試擦|試香|要不要|幫您|幫你|預約|下次|LINE|line|留個|登記|安排|約|提醒|結帳|包起來|寄|保留|連結|三天後|兩週後|一個月後/g,
  K_GEN: /\d+\s*(ml|滴|天|次|包|錠|小時|個月)|早晚|早上|晚上|步驟|成分|質地|吸收|局部|耳後|補擦|依標示|醫師|醫生|就醫/g,
  PUSH: /買一送一|最後一天|今天買|現在買|整套|一定要買|不買會後悔/,
  BLAME: /不可能|您應該是|你應該是|一定是您|一定是你|你自己|您自己.*才|怎麼會這樣都/,
};
const NEG = /不能|不可|無法|不是|不敢|沒辦法|並非|不應|不會說|不要說/;
function bannedHit(t) {
  const re = new RegExp(BANNED.source, 'g'); let m;
  while ((m = re.exec(t))) { if (!NEG.test(t.slice(Math.max(0, m.index - 4), m.index))) return m[0]; }
  return '';
}
const cnt = (re, t) => (t.match(re) || []).length;
const hits = (list, t) => (list || []).filter(w => t.includes(w)).length;
function scoreText(text, turn, sc) {
  const t = text.trim(); const s = { E: 0, A: 0, K: 0, V: 0, C: 0 }; const notes = [];
  const k = turn.k || {};
  const prodKeys = (sc.products || []).flatMap(id => (prod(id) || {}).keys || []);
  const e = cnt(RX.E, t) + hits(k.E, t); s.E = e >= 2 ? 3 : e ? 2 : 0;
  const a = cnt(RX.A, t) + hits(k.A, t); s.A = a >= 2 ? 3 : a ? 2 : 0;
  const kk = hits(prodKeys, t) + hits(k.K, t) + Math.min(1, cnt(RX.K_GEN, t)); s.K = Math.min(3, kk);
  const v = cnt(RX.V, t) + hits(k.V, t); s.V = v >= 2 ? 3 : v ? 2 : 0;
  const c = cnt(RX.C, t) + hits(k.C, t); s.C = c >= 2 ? 3 : c ? 2 : 0;
  let x = 0;
  const bad = bannedHit(t);
  if (bad) { x = 1; notes.push(`⚠️ 出現誇大或療效用語「${bad}」，請改用合規說法（見「流程」分頁的合規用語對照）。`); }
  if (RX.BLAME.test(t)) { s.E = Math.max(-2, s.E - 3); notes.push('語氣像在否定或指責顧客，先接住感受再說明。'); }
  if (RX.PUSH.test(t) && /[EA]/.test(turn.focus)) { s.C -= 2; s.E -= 1; notes.push('這時候推促銷或成交太早，顧客會有壓力。'); }
  if (t.length < 10) { for (const d in s) s[d] = Math.min(s[d], 1); notes.push('回答有點短，多說一句會更有溫度。'); }
  if (t.length > 160) notes.push('有點長，顧客可能聽不完；試著濃縮成 2–3 句。');
  const fd = turn.focus.split('');
  const avg = fd.reduce((n, d) => n + Math.max(0, s[d]), 0) / fd.length;
  let q = avg >= 2.2 ? 2 : avg >= 1.2 ? 1 : 0;
  if (x) q = 0;
  const good = fd.filter(d => s[d] >= 2).map(d => DIM[d].n);
  const weak = fd.filter(d => s[d] < 2);
  return { s, q, x, notes, good, weak };
}

/* =====================================================================
   練習流程
   ===================================================================== */
let play = null; // { sc, ti, mood, earned, max, log, x, mode, picks }
const moodFace = m => m >= 75 ? '😊' : m >= 55 ? '🙂' : m >= 35 ? '😐' : m >= 15 ? '😕' : '😠';
const moodColor = m => m >= 60 ? 'var(--ok)' : m >= 35 ? 'var(--mid)' : 'var(--bad)';

function maxFor(turn) {
  const m = { E: 0, A: 0, K: 0, V: 0, C: 0 };
  // 滿分以「最佳回答」示範到的面向為準，普通選項碰巧得分的面向不另計
  if (turn.o && turn.o.length) for (const o of turn.o.filter(o => o.q === 2)) { const s = parseS(o.s); for (const d in s) m[d] = Math.max(m[d], s[d]); }
  else for (const d of turn.focus) m[d] = 3;
  return m;
}
function startPlay(id) {
  const sc = scen(id); if (!sc) return go('practice');
  play = { sc, ti: 0, mood: sc.p.mood ?? 50, earned: { E: 0, A: 0, K: 0, V: 0, C: 0 }, max: { E: 0, A: 0, K: 0, V: 0, C: 0 }, log: [], x: 0, picks: [], textMode: !(sc.turns[0].o || []).length, done: false };
  play.log.push({ t: 'sys', v: `${sc.ch}｜${sc.skill}` });
  play.log.push({ t: 'c', v: sc.turns[0].c });
  location.hash = 'play/' + id;
  if (state.profile.autoSpeak) speak(sc.turns[0].c);
}
function answer(opt, text) {
  const sc = play.sc, turn = sc.turns[play.ti];
  const m = maxFor(turn); for (const d in m) play.max[d] += m[d];
  let q, s, x, fb, reply, bestT = (turn.o || []).find(o => o.q === 2);
  if (opt) {
    ({ q } = opt); s = parseS(opt.s); x = opt.x ? 1 : 0; fb = opt.fb; reply = opt.r;
    play.log.push({ t: 'm', v: opt.t });
  } else {
    const r = scoreText(text, turn, sc); ({ q, s, x } = r);
    const parts = [];
    if (r.good.length) parts.push('👍 做得好：' + r.good.join('、') + '。');
    for (const d of r.weak) parts.push('💡 ' + DIM[d].n + '：' + DIM[d].tip);
    parts.push(...r.notes);
    fb = parts.join('\n');
    const same = (turn.o || []).find(o => o.q === q);
    reply = same ? same.r : (q === 2 ? '嗯，你說得有道理。' : q === 1 ? '喔…這樣啊。' : '…我不太懂你的意思。');
    play.log.push({ t: 'm', v: text });
  }
  for (const d in s) play.earned[d] += Math.min(s[d], m[d]);
  play.x += x;
  const delta = (q === 2 ? 15 : q === 1 ? 3 : -15) - (x ? 15 : 0);
  play.mood = Math.max(0, Math.min(100, play.mood + delta));
  play.picks.push({ ti: play.ti, q, x, text: opt ? opt.t : text });
  const label = q === 2 ? '✅ 很棒' : q === 1 ? '🟡 還可以更好' : '🔴 要調整';
  const dimsTxt = Object.entries(s).filter(([, v]) => v).map(([d, v]) => `${DIM[d].i}${DIM[d].n} ${v > 0 ? '+' : ''}${v}`).join('　');
  let kv = `${label}${x ? '　⚠️ 合規風險' : ''}\n${fb}`;
  if (dimsTxt) kv += `\n${dimsTxt}`;
  if (!opt && bestT) kv += `\n\n📝 參考說法：${bestT.t}`;
  play.log.push({ t: 'k', v: kv, q });
  play.log.push({ t: 'c', v: reply });
  play.ti++;
  if (play.mood <= 5 && play.ti < sc.turns.length) { play.log.push({ t: 'sys', v: '顧客失去耐心，對話提早結束了' }); return finish(); }
  if (play.ti >= sc.turns.length) return finish();
  play.log.push({ t: 'c', v: sc.turns[play.ti].c });
  if (!(sc.turns[play.ti].o || []).length) play.textMode = true;
  renderPlay();
  if (state.profile.autoSpeak) speak(reply + '。' + sc.turns[play.ti].c);
}
function computeScore(p) {
  const dims = {}; let sum = 0, n = 0;
  for (const d of DIMS) { if (p.max[d.k] > 0) { dims[d.k] = Math.max(0, Math.min(1, p.earned[d.k] / p.max[d.k])); sum += dims[d.k]; n++; } }
  let score = n ? Math.round(sum / n * 100) : 0;
  score = Math.max(0, score - p.x * 10);
  return { dims, score };
}
function finish() {
  const { dims, score } = computeScore(play);
  play.done = true; play.result = { dims, score };
  if (!play.saved) {
    state.sessions.push({ id: uid(), sid: play.sc.id, title: play.sc.title, ch: play.sc.ch, at: new Date().toISOString(), score, dims, mood: play.mood, x: play.x, mode: play.picks.some((p, i) => !(play.sc.turns[p.ti].o || []).some(o => o.t === p.text)) ? 'text' : 'choice' });
    play.saved = true; save();
  }
  renderPlay();
  setTimeout(() => { const r = $('#result'); r && r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80);
}

function renderPlay() {

      <div class="row" style="margin-top:6px">${SR ? `<button class="btn sm" data-act="mic" aria-pressed="false" aria-label="用說的">🎤</button>` : ''}<span class="small muted grow">${SR ? '可以按 🎤 用說的' : ''}</span><button class="btn sm primary" data-act="send">送出</button></div>`;
    bottom = `<div class="composer">
      <div class="row small"><span class="grow muted">第 ${play.ti + 1}／${sc.turns.length} 回合　重點：${turn.focus.split('').map(d => DIM[d].i + DIM[d].n).join('、')}</span><button class="btn sm ghost" data-act="hint">💡 提示</button></div>
      <div id="hintBox"></div>
      ${opts.length && !play.textMode ? opts.map((o, i) => `<button class="opt" data-act="pick" data-i="${turn.o.indexOf(o)}"><b>${'ABC'[i]}</b>${esc(o.t)}</button>`).join('') + `<button class="btn sm ghost block" data-act="text-mode">✍️ 我想自己說說看</button>`
        : textBox + (opts.length ? `<button class="btn sm ghost block" data-act="choice-mode" style="margin-top:4px">🔤 改用選項作答</button>` : '')}

    const weakest = Object.entries(dims).sort((a, b) => a[1] - b[1])[0];
    result = `<div id="result" class="card">
      <div class="center">${ring(score)}<h2 style="margin:6px 0 2px">${grade}</h2><p class="muted small">顧客心情 ${moodFace(m)} ${m}　${play.x ? `｜⚠️ 合規風險 ${play.x} 次（每次扣 10 分）` : '｜✅ 全程合規'}</p></div>

        <button class="btn grow" data-act="next-rec">➡️ 下一個推薦</button>
      </div>
      <div class="row wrap" style="margin-top:8px">
        <button class="btn sm grow" data-act="share-result">📤 分享成績</button>
        <button class="btn sm grow" data-act="ai-prompt" data-id="${sc.id}">🤖 找 AI 自由對練</button>

}
function ring(v) {

}
const dimRow = (d, v) => `<div class="dimrow"><span class="name">${d.i} ${d.n}</span><span class="bar"><i style="width:${Math.round(v * 100)}%"></i></span><span class="v">${Math.round(v * 100)}</span></div>`;

/* =====================================================================
   推薦、統計、徽章
   ===================================================================== */
function dimAverages() {
  const acc = {}; const n = {};
  for (const s of state.sessions.slice(-20)) for (const d in s.dims) { acc[d] = (acc[d] || 0) + s.dims[d]; n[d] = (n[d] || 0) + 1; }
  const out = {}; for (const d of DIMS) out[d.k] = n[d.k] ? acc[d.k] / n[d.k] : null; return out;
}
function recommend() {
  const av = dimAverages();
  const known = DIMS.filter(d => av[d.k] != null).sort((a, b) => av[a.k] - av[b.k]);
  const weak = known.length ? known[0].k : null;
  const role = state.profile.role;
  const prefer = role === 'TM 電話' ? 'TM 電話' : role === '門市人員' ? '門市' : role === '客服人員' ? '客服' : role === '直銷／美容顧問' ? '到府／直銷' : null;
  const cands = SCENARIOS.map(s => {
    const b = best(s.id); let pts = 0;
    if (b == null) pts += 30; else if (b < 80) pts += 20 - b / 10; else pts -= 30;
    if (weak) pts += s.turns.filter(t => t.focus.includes(weak)).length * 6;
    if (prefer && s.ch === prefer) pts += 12;
    if (!state.sessions.length) pts -= s.lv * 8;
    return { s, pts };
  }).sort((a, b) => b.pts - a.pts);
  return { s: cands[0].s, weak };
}
function streak() {
  const days = new Set([...state.sessions, ...state.drills].map(x => dayKey(x.at)));
  let n = 0; const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function badges() {
  const S = state.sessions;
  const chs = new Set(S.map(s => s.ch));
  const objIds = SCENARIOS.filter(s => s.skill === '異議處理').map(s => s.id);
  const lastTen = S.slice(-10);
  return [
    { i: '🌱', n: '第一次練習', on: S.length >= 1 },
    { i: '🔥', n: '連續 3 天', on: streak() >= 3 },
    { i: '🏆', n: '90 分以上', on: S.some(s => s.score >= 90) },
    { i: '🧭', n: '走遍 5 種通路', on: CHANNELS.every(c => chs.has(c)) },
    { i: '🛡️', n: '異議處理達人', on: objIds.every(id => (best(id) || 0) >= 80) },
    { i: '⚖️', n: '合規守門員', on: lastTen.length >= 10 && lastTen.every(s => !s.x) },
    { i: '⚡', n: '快問快答 10 題', on: state.drills.length >= 10 },
    { i: '📚', n: '知識測驗全對', on: state.quizzes.some(q => q.right === q.total) },
    { i: '🎓', n: '完成全部情境', on: SCENARIOS.every(s => best(s.id) != null) },
  ];
}

  const split3 = l => { const [f, a, b] = l.split(/[｜|]/).map(x => x.trim()); return { f: f || '', a: a || '', b: b || a || '' }; };
  const p = { id: id || 'p-' + uid(), custom: true, name, cat: $('#pCat').value.trim() || '其他', price: Number($('#pPrice').value) || '', icon: $('#pIcon').value.trim() || '🛍️',
    size: $('#pSize').value.trim(), who: $('#pWho').value.trim(),
    fab: $('#pFab').value.split('\n').map(x => x.trim()).filter(Boolean).map(split3),
    faq: $('#pFaq').value.split('\n').map(x => x.trim()).filter(Boolean).map(l => l.split(/[｜|]/).map(x => x.trim())).filter(x => x[0]).map(([q, a]) => [q, a || '']),
    keys: $('#pKeys').value.split(/[、,，\s]+/).map(x => x.trim()).filter(Boolean), avoid: $('#pAvoid').value.trim(), pair: [] };
  const i = state.customProd.findIndex(x => x.id === p.id);
  if (i >= 0) state.customProd[i] = p; else state.customProd.push(p);
  save(); closeSheet(); render(); toast('已儲存商品');
}

let quiz = null;
function makeQuiz() {
  const ps = allProducts().filter(p => (p.fab || []).length);
  const qs = [];
  for (const p of shuffle(ps).slice(0, 2)) {
    const f = shuffle(p.fab);
    const others = shuffle(ps.flatMap(x => x.fab.map(y => y.f))).filter(t => t !== f[0].f).slice(0, 2);
    qs.push({ q: `介紹「${p.name}」時，下列哪一句是對顧客的「好處（Benefit）」，而不只是特色？`, right: f[0].b, opts: shuffle([f[0].b, f[0].f, ...others.slice(0, 1)]), why: `「${f[0].b}」說出了顧客能得到什麼；「${f[0].f}」只是產品特色。` });
  }
  for (const p of shuffle(ps.filter(p => p.who)).slice(0, 2)) {
    const wrong = shuffle(ps.filter(x => x.id !== p.id && x.who)).slice(0, 2).map(x => x.name);
    qs.push({ q: `顧客的狀況是：「${p.who}」，最適合先推薦哪一個？`, right: p.name, opts: shuffle([p.name, ...wrong]), why: `${p.name} 的適用對象就是這類顧客。` });
  }
  const bad = shuffle(COMPLIANCE)[0];
  const okOpts = shuffle(COMPLIANCE.filter(c => c !== bad)).slice(0, 2).map(c => c[1]);
  const badPhrase = bad[0].split('、')[0];
  qs.push({ q: '下列哪一句話「不能」對顧客說？', right: badPhrase, opts: shuffle([badPhrase, ...okOpts]), why: `「${badPhrase}」屬於誇大或療效用語，可改說：「${bad[1]}」。` });
  return shuffle(qs).slice(0, 5);
}
function openQuiz() { quiz = { qs: makeQuiz(), i: 0, right: 0, ans: null }; renderQuiz(); }
function renderQuiz() {
  if (quiz.i >= quiz.qs.length) {
    state.quizzes.push({ at: new Date().toISOString(), right: quiz.right, total: quiz.qs.length }); save();
    return openSheet('📝 測驗結果', `<div class="center">${ring(Math.round(quiz.right / quiz.qs.length * 100))}<h2>答對 ${quiz.right}／${quiz.qs.length} 題</h2><p class="muted">${quiz.right === quiz.qs.length ? '全對！產品知識很紮實 🎉' : '把答錯的商品卡再看一次，下次會更好。'}</p></div><button class="btn primary block" data-act="quiz">再測一次</button>`);
  }
  const q = quiz.qs[quiz.i];
  openSheet(`📝 第 ${quiz.i + 1}／${quiz.qs.length} 題`, `<p><b>${esc(q.q)}</b></p>
    ${q.opts.map((o, i) => `<button class="qopt ${quiz.ans != null ? (o === q.right ? 'right' : i === quiz.ans ? 'wrong' : '') : ''}" data-act="qans" data-i="${i}" ${quiz.ans != null ? 'disabled' : ''}>${esc(o)}</button>`).join('')}
    ${quiz.ans != null ? `<p class="small">${q.opts[quiz.ans] === q.right ? '✅ 答對了！' : '❌ 再想想。'}${esc(q.why)}</p><button class="btn primary block" data-act="qnext">下一題</button>` : ''}`);
}

function radar(vals) {
  const cx = 130, cy = 120, R = 86, n = DIMS.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const rings = [0.25, 0.5, 0.75, 1].map(f => `<polygon points="${DIMS.map((_, i) => pt(i, R * f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`).join('');
  const axes = DIMS.map((d, i) => { const [x, y] = pt(i, R); const [lx, ly] = pt(i, R + 22); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/><text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="12" fill="var(--muted)">${d.n}</text>`; }).join('');
  const shape = DIMS.map((d, i) => pt(i, R * (vals[d.k] ?? 0)).join(',')).join(' ');
  return `<svg viewBox="0 0 260 245" style="width:100%;max-width:340px;display:block;margin:0 auto" role="img" aria-label="五力雷達圖">${rings}${axes}<polygon points="${shape}" fill="var(--brand)" fill-opacity=".25" stroke="var(--brand)" stroke-width="2"/>${DIMS.map((d, i) => { const [x, y] = pt(i, R * (vals[d.k] ?? 0)); return `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--brand)"/>`; }).join('')}</svg>`;
}
function trend(xs) {
  if (xs.length < 2) return '<p class="small muted">練習兩次以上就會出現分數趨勢。</p>';
  const W = 300, H = 80, n = xs.length;
  const p = xs.map((v, i) => [10 + i * (W - 20) / (n - 1), H - 10 - (v / 100) * (H - 20)]);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:90px" role="img" aria-label="最近分數趨勢"><line x1="10" x2="${W - 10}" y1="${H - 10 - .8 * (H - 20)}" y2="${H - 10 - .8 * (H - 20)}" stroke="var(--line)" stroke-dasharray="4 4"/><polyline points="${p.map(q => q.join(',')).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>${p.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--brand)"><title>${xs[i]} 分</title></circle>`).join('')}</svg>`;
}

    <details class="acc"><summary>👥 三人角色扮演（顧客／銷售／觀察員）</summary><div class="body small"><ol class="tight"><li>觀察員打開一個情境，扮演顧客念台詞，並保密「顧客內心話」。</li><li>銷售者用自己的話回答，觀察員依五力各給 0–3 分。</li><li>結束後由觀察員揭曉內心話，三人輪流換角色。</li><li>最後每人用 App 再練一次同一情境，比較分數。</li></ol></div></details>
    <details class="acc"><summary>🌱 新人 7 天上手計畫</summary><div class="body small"><table class="t"><tr><td>Day 1</td><td>讀「🧭 流程」六步驟＋合規用語，完成 1 個 ★ 情境</td></tr><tr><td>Day 2</td><td>讀商品卡，知識小測驗拿到 4 題以上</td></tr><tr><td>Day 3–5</td><td>每天 2 個情境＋5 題快問快答，至少一次用「自己說」</td></tr><tr><td>Day 6</td><td>和主管做三人角色扮演，建立一個自訂情境</td></tr><tr><td>Day 7</td><td>分享成長報告給主管，討論最弱的一個面向</td></tr></table></div></details>
    <details class="acc"><summary>📞 TM 團隊：每週一主題</summary><div class="body small"><ul class="tight"><li>開啟「自動朗讀顧客台詞」，模擬電話情境。</li><li>第 1 週開場許可、第 2 週忙碌異議、第 3 週回購提醒、第 4 週沉睡喚回（用自訂情境）。</li><li>每週五各自分享成長報告，主管看五力趨勢給回饋。</li></ul></div></details>
    <details class="acc"><summary>🏬 把真實案例變成教材</summary><div class="body small"><p>把門市或客服遇過的真實狀況（去除姓名、電話等個資）寫成「自訂情境」，再用「💾 備份」把檔案傳給同仁「還原」，全團隊就能練同一題。</p></div></details>`);
}

/* =====================================================================
   路由與事件
   ===================================================================== */
let tab = 'practice';
function applyPrefs() {
  const p = state.profile;
  document.documentElement.classList.toggle('big', !!p.big);
  if (p.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', p.theme);
}
function go(t) { location.hash = t; }
function route() {
  const h = location.hash.slice(1) || 'practice';
  if (h.startsWith('play/')) {
    const id = h.slice(5);
    if (!play || play.sc.id !== id) { const sc = scen(id); if (!sc) return go('practice'); startPlay(id); return; }
    return renderPlay();
  }
  if (h === 'drill') { tab = 'practice'; history.replaceState(null, '', '#practice'); render(); openDrill(); return; }
  if (play && !play.done) play = null;
  document.body.classList.remove('playing');
  tab = ['practice', 'knowledge', 'flow', 'progress', 'more'].includes(h) ? h : 'practice';
  render();
}
function render() {
  if (location.hash.startsWith('#play/') && play) return renderPlay();
  document.body.classList.remove('playing');
  $('#title').textContent = { practice: '銷售教練', knowledge: '產品知識', flow: '服務流程', progress: '我的成長', more: '更多' }[tab];
  $$('#tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  ({ practice: renderPractice, knowledge: renderKnowledge, flow: renderFlow, progress: renderProgress, more: renderMore })[tab]();
  scrollTo(0, 0);
}
function openWelcome() {
  openSheet('👋 歡迎使用銷售教練', `
    <p>這是你的口袋教練：用虛構的顧客情境練習服務與銷售，每句話都有即時點評。</p>
    <label class="f" for="wName">怎麼稱呼你？</label><input type="text" id="wName" placeholder="例：小美">
    <label class="f">你的角色</label><div class="chips" style="flex-wrap:wrap">${ROLES.map(r => `<button class="chip" data-act="w-role" data-v="${r}" aria-pressed="false">${r}</button>`).join('')}</div>
    <button class="btn primary block" data-act="welcome-go" style="margin-top:14px">開始第一個練習 ▶</button>`);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-tab]'); if (!el) return;
  if (el.dataset.tab) { if (play) play = null; go(el.dataset.tab); return; }
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'close-sheet': closeSheet(); break;
    case 'play': closeSheet(); play = null; startPlay(id); break;
    case 'pick': { const turn = play.sc.turns[play.ti]; answer(turn.o[Number(el.dataset.i)]); break; }
    case 'send': { const t = $('#ans').value.trim(); if (!t) return toast('先寫下你想說的話'); answer(null, t); break; }
    case 'text-mode': play.textMode = true; renderPlay(); $('#ans').focus(); break;
    case 'choice-mode': play.textMode = false; renderPlay(); break;
    case 'hint': { const t = play.sc.turns[play.ti]; $('#hintBox').innerHTML = `<div class="quote small">💡 ${esc(t.hint || t.focus.split('').map(d => DIM[d].tip).join(' '))}</div>`; break; }
    case 'mic': listen($('#ans'), el); break;
    case 'mic-drill': listen($('#drillAns'), el); break;
    case 'say': e.stopPropagation(); speak(el.dataset.t); break;
    case 'replay': { const sid = play.sc.id; play = null; startPlay(sid); renderPlay(); scrollTo(0, 0); break; }
    case 'next-rec': { const r = recommend().s; play = null; startPlay(r.id); renderPlay(); scrollTo(0, 0); break; }
    case 'share-result': shareText(`🎯【銷售教練】我完成了${quoted(play.sc.title)}練習，拿到 ${play.result.score} 分！\n` + DIMS.filter(d => d.k in play.result.dims).map(d => `${d.i}${d.n} ${Math.round(play.result.dims[d.k] * 100)}`).join('　')); break;
    case 'ai-prompt': openAI(id); break;
    case 'copy-ai': copyText($('#aiText').value, '已複製，貼到 AI 就能開始練習'); break;
    case 'drill': openDrill(); break;
    case 'drill-id': openDrill(id); break;
    case 'drill-next': openDrill(); break;
    case 'drill-send': submitDrill(); break;
    case 'f-ch': filt.ch = el.dataset.v; renderPractice(); break;
    case 'f-skill': filt.skill = el.dataset.v; renderPractice(); break;
    case 'new-scen': openScenForm(); break;
    case 'save-scen': saveScen(id); break;
    case 'del-scen': if (confirm('確定刪除這個自訂情境？')) { state.customScen = state.customScen.filter(s => s.id !== id); save(); closeSheet(); render(); } break;
    case 'kcat': kcat = el.dataset.v; renderKnowledge(); break;
    case 'prod': openProd(id); break;
    case 'new-prod': openProdForm(); break;
    case 'edit-prod': openProdForm(id); break;
    case 'save-prod': saveProd(id); break;
    case 'del-prod': if (confirm('確定刪除這個商品？')) { state.customProd = state.customProd.filter(p => p.id !== id); save(); closeSheet(); render(); } break;
    case 'quiz': openQuiz(); break;
    case 'qans': quiz.ans = Number(el.dataset.i); if (quiz.qs[quiz.i].opts[quiz.ans] === quiz.qs[quiz.i].right) quiz.right++; renderQuiz(); break;
    case 'qnext': quiz.i++; quiz.ans = null; renderQuiz(); break;
    case 'share-progress': shareText(progressText()); break;
    case 'csv': {
      const rows = [['日期', '情境', '通路', '分數', ...DIMS.map(d => d.n), '顧客心情', '合規風險次數']];
      for (const s of state.sessions) rows.push([s.at.slice(0, 16).replace('T', ' '), s.title, s.ch, s.score, ...DIMS.map(d => s.dims[d.k] == null ? '' : Math.round(s.dims[d.k] * 100)), s.mood, s.x]);
      download(`銷售教練練習紀錄_${today()}.csv`, '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n'), 'text/csv'); break;
    }
    case 'install': install(); break;
    case 'hide-install': try { localStorage.setItem('ssc-hide-install', today()); } catch (err) { /* 無法寫入 */ } render(); break;
    case 'guide': openGuide(); break;
    case 'trainer': openTrainer(); break;
    case 'backup': download(`銷售教練備份_${today()}.json`, JSON.stringify(state, null, 1)); break;
    case 'reset': if (confirm('確定清除所有練習紀錄、自訂情境與商品？這個動作無法復原。')) { state = blank(); state.profile.onboarded = true; save(); applyPrefs(); render(); toast('已清除'); } break;
    case 'w-role': $$('[data-act="w-role"]').forEach(b => b.setAttribute('aria-pressed', b === el)); state.profile.role = el.dataset.v; break;
    case 'welcome-go': state.profile.name = $('#wName').value.trim(); state.profile.onboarded = true; save(); closeSheet(); { const r = recommend().s; startPlay(r.id); } break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet').classList.contains('open')) closeSheet();
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { if (e.target.id === 'ans') $('[data-act="send"]').click(); if (e.target.id === 'drillAns') submitDrill(); }
});
$('#helpBtn').addEventListener('click', openGuide);
$('#backBtn').addEventListener('click', () => { speechSynthesis && speechSynthesis.cancel && speechSynthesis.cancel(); play = null; go('practice'); });
window.addEventListener('hashchange', route);
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', scrollY > 4), { passive: true });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (tab === 'practice' && !play) renderPractice(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; render(); });

/* ---------- 示範資料（截圖用：?demo=home / play / result / progress） ---------- */
function demoState() {
  const s = blank(); s.profile = { ...s.profile, name: '小美', role: '門市人員', onboarded: true };
  const base = Date.now() - 9 * 864e5; const scores = [58, 64, 61, 72, 70, 78, 75, 83, 86, 91];
  scores.forEach((sc, i) => { const S = SCENARIOS[i % SCENARIOS.length]; s.sessions.push({ id: 'd' + i, sid: S.id, title: S.title, ch: S.ch, at: new Date(base + i * 864e5).toISOString(), score: sc, dims: { E: Math.min(1, sc / 100 + .08), A: Math.min(1, sc / 100 - .02), K: Math.min(1, sc / 100 + .04), V: Math.max(0, sc / 100 - .12), C: Math.min(1, sc / 100 - .05) }, mood: 60 + i * 3, x: i < 2 ? 1 : 0, mode: 'choice' }); });
  for (let i = 0; i < 6; i++) s.drills.push({ at: new Date(base + i * 1.4 * 864e5).toISOString(), id: 'o' + (i + 1), q: 2 });
  return s;
}

/* ---------- 啟動 ---------- */
state = demo ? demoState() : load();
if (demo) document.documentElement.classList.add('demo');
applyPrefs();
if (demo === 'play' || demo === 'result') {
  startPlay('s1');
  const t = SCENARIOS[0].turns;
  answer(t[0].o[0]);
  if (demo === 'play') answer(null, '卡粉通常跟缺水有關，想了解一下您平常早晚保養有哪幾個步驟呢？洗完臉會緊繃嗎？');
  else { answer(t[1].o[0]); answer(t[2].o[1]); answer(t[3].o[0]); }
} else {
  if (demo === 'progress') location.hash = 'progress';
  if (demo === 'knowledge') location.hash = 'knowledge';
  route();
}
if (!state.profile.onboarded && !demo && !location.hash.startsWith('#play/')) openWelcome();

if ('serviceWorker' in navigator && location.protocol !== 'file:' && !demo) {
  const hadController = !!navigator.serviceWorker.controller; // 第一次安裝不算更新
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => {
        if (w.state === 'activated' && hadController) toast('銷售教練有新版本了', '立即更新', () => location.reload());
      });
    });
  }).catch(() => { /* 不支援時照常使用 */ });
}
</script>
